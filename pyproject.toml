[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-ops-agent"
version = "0.1.0"
description = "Portfolio demo: a customer-support operations agent with policy gates, an audit trail, and an eval CI check."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Arpan Bom" }]
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.6,<3",
    "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]

[project.scripts]
support-ops = "support_ops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["support_ops", "tests"]
